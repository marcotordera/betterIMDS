# Server Configuration
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/betterimds_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Data JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Enable HTTP Access Logging in Terminal (Method, Path, 200 OK)
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=%t "%r" %s %b (%D ms)

# Swagger UI Configuration (OpenAPI)
springdoc.swagger-ui.path=/swagger-ui.html

# Spring Boot DevTools Hot-Reload Configuration
spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=1s
spring.devtools.restart.quiet-period=500ms

# Application & Framework Logging
logging.level.com.betterimds=DEBUG
logging.level.org.springframework.web=INFO
